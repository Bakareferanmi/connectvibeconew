<!DOCTYPE html>

  <style>
    @font-face {
      font-family: "LibSans";
      src: url("file:///usr/share/fonts/truetype/liberation/LiberationSans-Bold.ttf") format("truetype");
      font-weight: 700;
    }
    @font-face {
      font-family: "LibSans";
      src: url("file:///usr/share/fonts/truetype/liberation/LiberationSans-Regular.ttf") format("truetype");
      font-weight: 400;
    }
    html, body { margin: 0; padding: 0; background: #000; }
    #card {
      position: relative;
      width: 1200px;
      height: 630px;
      overflow: hidden;
      background: #002D6B;
      font-family: "LibSans", "Liberation Sans", sans-serif;
    }
    .wordmark {
      position: absolute;
      left: 140px;
      right: 140px;
      top: 372px;
      text-align: center;
      font-weight: 700;
      font-size: 50px;
      letter-spacing: 0.04em;
      color: #ffffff;
      text-transform: lowercase;
      line-height: 1;
      text-shadow: 0 10px 32px rgba(0, 16, 48, 0.55);
    }
    .wordmark .co { color: #00BFA6; }
    .tag {
      position: absolute;
      left: 140px;
      right: 140px;
      top: 442px;
      text-align: center;
      font-weight: 400;
      font-size: 16px;
      letter-spacing: 0.42em;
      text-transform: uppercase;
      color: #F4F7FA;
      opacity: 0.8;
    }
    .logo-wrap {
      position: absolute;
      left: 50%;
      top: 148px;
      width: 196px;
      height: 196px;
      transform: translateX(-50%);
      filter: drop-shadow(0 22px 40px rgba(0, 14, 44, 0.45));
    }
  </style>
